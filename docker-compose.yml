version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: achariya_one
      POSTGRES_USER: achariya
      POSTGRES_PASSWORD: achariya_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U achariya -d achariya_one']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
