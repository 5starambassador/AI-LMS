<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230D9488'/><text y='.9em' font-size='70' x='15' fill='white'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achariya AI ONE · Enterprise Learning, Speech AI & Assessment Ecosystem</title>
    <!-- Google Fonts: Plus Jakarta Sans for clean modern aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              achariya: {
                50: '#F0FDFA',
                100: '#CCFBF1',
                200: '#99F6E4',
                500: '#14B8A6',
                600: '#0D9488',
                700: '#0F766E',
                900: '#134E4A'
              },
              brand: {
                teal: '#0D9488',
                blue: '#2563EB',
                purple: '#7C3AED',
                amber: '#D97706',
                rose: '#E11D48',
                slate: '#0F172A'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            },
            fontSize: {
              xs: ['0.875rem', { lineHeight: '1.375rem' }],     // 14px (up from 12px)
              sm: ['0.9375rem', { lineHeight: '1.45rem' }],     // 15px (up from 14px)
              base: ['1.03125rem', { lineHeight: '1.6rem' }],   // 16.5px (up from 16px)
              lg: ['1.1875rem', { lineHeight: '1.75rem' }],     // 19px (up from 18px)
              xl: ['1.3125rem', { lineHeight: '1.85rem' }],     // 21px (up from 20px)
              '2xl': ['1.5625rem', { lineHeight: '2.05rem' }]   // 25px (up from 24px)
            }
          }
        }
      }
    </script>
    <style>
      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      /* Enterprise Readability Floor for arbitrary micro-pixel utility classes */
      .text-\[9px\] {
        font-size: 0.75rem !important;      /* 12px (was 9px) */
        line-height: 1.1rem !important;
      }
      .text-\[10px\] {
        font-size: 0.78125rem !important;   /* 12.5px (was 10px) */
        line-height: 1.15rem !important;
      }
      .text-\[11px\] {
        font-size: 0.84375rem !important;   /* 13.5px (was 11px) */
        line-height: 1.25rem !important;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #CBD5E1;
        border-radius: 9999px;
      }
      @media print {
        body > * { display: none !important; }
        body > #root > * { display: none !important; }
        #grade-card-print, #grade-card-print * { display: revert !important; visibility: visible !important; }
        #grade-card-print { position: fixed; inset: 0; background: white; padding: 2rem; }
        #report-card-print, #report-card-print * { display: revert !important; visibility: visible !important; }
        #report-card-print { position: fixed; inset: 0; background: white; padding: 2rem; overflow: auto; }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
